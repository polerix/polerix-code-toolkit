<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the page use the notch area; the web-core.css safe-area helpers keep the HUD clear of it -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Generated by buildCsp({}, { inlineScripts: true }). Extend connect-src etc. for the APIs this site really calls. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/gh/polerix/ 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net/gh/polerix/ https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>Polerix site bootstrap</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/polerix/polerix-code-toolkit@v1.1.0/packages/web-core/web-core.css">
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #0f0; font-family: 'Courier New', monospace; }
    #stage { position: relative; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }   /* required for fitCanvas */
    #hud { position: fixed; top: 0; left: 0; right: 0; box-sizing: border-box; pointer-events: none; }
    #pad { position: fixed; left: 0; right: 0; bottom: 0; box-sizing: border-box; display: flex; justify-content: space-between; align-items: flex-end; }
    #stick { width: 140px; height: 140px; border: 2px solid #0f0; border-radius: 50%; margin: 16px; opacity: .7; }
    #fire { width: 88px; height: 88px; border: 2px solid #0f0; border-radius: 50%; margin: 16px; background: none; color: inherit; font: inherit; }
  </style>
</head>
<body class="wc-fill">
  <div id="stage" class="wc-fill"><canvas id="c"></canvas></div>
  <div id="hud" class="wc-safe-pad">
    <div id="info"></div>
    <div class="wc-keyboard-hint">Arrows/WASD move, Space fires</div>
    <button class="wc-fullscreen-btn" id="fs" style="pointer-events:auto">Fullscreen</button>
  </div>
  <!-- Touch controls. Hidden on desktop by html.no-touch; they drive the SAME actions as the keyboard. -->
  <div id="pad" class="wc-touch-only wc-safe-pad"><div id="stick"></div><button id="fire" data-action="fire">FIRE</button></div>

  <script type="module">
    // Pin to an exact toolkit tag. The steward opens a PR when a newer release exists inside the range in polerix.json.
    import {
      initAdaptive, observeCanvas, createLoop, createActions,
      bindKeyboard, bindButtons, bindStick, pollGamepad, createAudioUnlock, createStore, escapeHtml,
    } from 'https://cdn.jsdelivr.net/gh/polerix/polerix-code-toolkit@v1.1.0/packages/web-core/index.mjs';

    const { caps, requestFullscreen } = initAdaptive();          // sets html.is-touch / is-mobile / no-fullscreen ...
    const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
    let size = { cssW: 0, cssH: 0 };
    observeCanvas(cvs, ctx, (s) => { size = s; });

    const actions = createActions();                              // one input model for every device
    bindKeyboard(actions, { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', Space: 'fire' });
    bindButtons(actions, document);                               // [data-action] on-screen buttons
    bindStick(actions, document.getElementById('stick'));         // virtual stick -> left/right/up/down

    createAudioUnlock();                                          // starts on the first real gesture (touchend/pointerup/keydown)
    const store = createStore({ namespace: 'bootstrap_' });       // never throws; not for secrets
    let best = store.get('best', 0);

    document.getElementById('fs').onclick = () => requestFullscreen().catch(() => {});
    document.getElementById('info').innerHTML =
      escapeHtml(`${caps.profile} | touch=${caps.touch} | standalone=${caps.standalone} | dpr=${caps.viewport.dpr} | best=${best}`);

    const p = { x: 200, y: 200 };
    createLoop({
      update(dt) {
        pollGamepad(actions, { 0: 'fire' });
        p.x += actions.axis('left', 'right') * 240 * dt;
        p.y += actions.axis('up', 'down') * 240 * dt;
        if (actions.isDown('fire')) store.set('best', ++best);
      },
      render() {
        ctx.clearRect(0, 0, size.cssW, size.cssH);
        ctx.fillStyle = '#0f0'; ctx.fillRect(p.x - 10, p.y - 10, 20, 20);
      },
    }).start();
  </script>
</body>
</html>
